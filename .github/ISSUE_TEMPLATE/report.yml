name: Report
description: A bug, or a report from another keyboard or macOS build
body:
  - type: input
    id: machine
    attributes:
      label: Laptop or keyboard model
      placeholder: Legion 5 15IAX10 (83F0), internal ITE 8258 USB keyboard
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: macOS build and numpad-arrows version
      placeholder: 26.7.1 (25G241), numpad-arrows 0.1.0
    validations:
      required: true
  - type: textarea
    id: launchctl
    attributes:
      label: Output of launchctl print gui/$(id -u)/org.watchthelight.numpad-arrows | grep -E 'state|last exit'
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which key, which app, what you expected, whether Accessibility is switched on for the binary, and whether hidutil remapping works on this keyboard.
    validations:
      required: true
